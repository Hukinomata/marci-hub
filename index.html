<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Üzenetek ❤️</title>
  <style>
    /* ===================================================
       1. TÉMÁK ÉS ALAP BEÁLLÍTÁSOK
       =================================================== */
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --border: #e2e8f0;
      --input-bg: #ffffff;
      --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-text: #dc2626;
    }

    :root[data-theme="dark"] {
      --bg: #070d18;
      --card-bg: #0f1c2e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #38bdf8;
      --border: #1e293b;
      --input-bg: #0a1322;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --danger-bg: rgba(239, 68, 68, 0.2);
      --danger-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      transition: background-color 0.3s, color 0.3s;
    }

    .hidden { display: none !important; }

    /* ===================================================
       2. MOBILBARÁT FEJLÉC (NINCS TÖBB ÁTFEDÉS)
       =================================================== */
    .app-header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 16px 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-left h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }

    .badge {
      background: rgba(2, 132, 199, 0.2);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px; /* Tisztes távolság a két gomb között */
    }

    .btn-header {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-logout {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-color: transparent;
    }

    /* ===================================================
       3. ŰRLAPOK ÉS BEVITELI MEZŐK
       =================================================== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }

    .login-card {
      max-width: 380px;
      margin-top: 40px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    /* 16px-es betűméret: megakadályozza az iPhone/Android rázoomolást */
    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    input[type="file"] {
      width: 100%;
      padding: 8px 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.85; }

    /* ===================================================
       4. AJÁNDÉKOK RÁCSA (TELEFONON 2 OSZLOP)
       =================================================== */
    .gift-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 600px;
    }

    .gift-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 140px;
      transition: transform 0.15s;
    }
    .gift-card:active { transform: scale(0.97); }

    .gift-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }

    .gift-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      word-break: break-word;
    }

    .btn-delete {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 10px;
      cursor: pointer;
    }

    /* ===================================================
       5. FELUGRÓ ABLAK (MODAL) ÉS KÉPGALÉRIA
       =================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 480px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      text-align: center;
    }

    .modal-text {
      white-space: pre-wrap;
      text-align: left;
      line-height: 1.6;
      font-size: 0.95rem;
      margin: 16px 0;
      color: var(--text);
    }

    .gallery {
      position: relative;
      width: 100%;
      height: 250px;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      margin: 14px 0;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gallery-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .gallery-btn.prev { left: 8px; }
    .gallery-btn.next { right: 8px; }

    .gallery-counter {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- 1. BEJELENTKEZÉS -->
  <div id="login-view" class="card login-card">
    <h2 style="margin-bottom: 8px;">Belépés ✨</h2>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Nyisd ki, ha látni szeretnéd az üzeneteket</p>
    
    <div class="form-group">
      <input type="email" id="login-email" placeholder="E-mail cím" autocomplete="email" />
    </div>
    <div class="form-group">
      <input type="password" id="login-password" placeholder="Jelszó" />
    </div>

    <button class="btn-primary" id="btn-login">Bejelentkezés</button>
    <p id="login-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 12px; display: none;"></p>
  </div>

  <!-- 2. FŐOLDAL (BELÉPÉS UTÁN) -->
  <div id="app-view" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    
    <!-- Fejléc mobilon is átlátható elrendezéssel -->
    <header class="app-header">
      <div class="header-left">
        <h1>Üzenetek</h1>
        <span id="admin-badge" class="badge hidden">Admin</span>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn-header" aria-label="Téma váltás">☀️ / 🌙</button>
        <button id="btn-logout" class="btn-header btn-logout">Kilépés</button>
      </div>
    </header>

    <!-- Admin felület (Csak neked látható) -->
    <div id="admin-panel" class="card hidden">
      <h2 style="font-size: 1.15rem; margin-bottom: 14px;">Új üzenet hozzáadása</h2>
      
      <div class="form-group">
        <input type="text" id="gift-title-input" placeholder="Cím (pl. Nyisd ki, ha szomorú vagy...)" />
      </div>

      <div class="form-group">
        <label>Ikon:</label>
        <select id="gift-icon-input">
          <option value="🦈">🦈 Cápa</option>
          <option value="🎁">🎁 Ajándékdoboz</option>
          <option value="💌">💌 Levél</option>
          <option value="💖">💖 Szív</option>
          <option value="🧸">🧸 Maci</option>
          <option value="☕">☕ Kávé / Tea</option>
          <option value="🌟">🌟 Csillag</option>
        </select>
      </div>

      <div class="form-group">
        <textarea id="gift-message-input" placeholder="Üzenet szövege..."></textarea>
      </div>

      <div class="form-group">
        <label>Képek csatolása:</label>
        <input type="file" id="gift-files-input" accept="image/*" multiple />
      </div>

      <button class="btn-primary" id="btn-create-gift">Mentés</button>
      <p id="upload-status" style="font-size: 0.85rem; margin-top: 10px; color: var(--primary); text-align: center;"></p>
    </div>

    <!-- Ajándék kártyák nézete -->
    <div id="gift-grid" class="gift-grid"></div>
  </div>

  <!-- 3. MODAL (KINYITOTT ÜZENET) -->
  <div id="gift-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <h2 id="modal-title" style="color: var(--primary); font-size: 1.3rem;"></h2>
      <p id="modal-message" class="modal-text"></p>

      <!-- Galéria -->
      <div id="modal-gallery" class="gallery hidden">
        <img id="gallery-img" src="" alt="Feltöltött kép" />
        <button class="gallery-btn prev" id="gallery-prev">❮</button>
        <button class="gallery-btn next" id="gallery-next">❯</button>
        <div class="gallery-counter" id="gallery-counter">1 / 1</div>
      </div>

      <button class="btn-header" id="modal-close" style="width: 100%; margin-top: 14px; padding: 12px;">Bezárás</button>
    </div>
  </div>

  <!-- FIREBASE v10 MODULÁRIS SZKRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // ==========================================
    // 1. BEÁLLÍTÁSOK (Másold be a saját adataidat!)
    // ==========================================
    const firebaseConfig = {
      apiKey: "IDE_MASOLD_AZ_API_KEYT",
      authDomain: "PROJEKTED.firebaseapp.com",
      projectId: "PROJEKTED",
      storageBucket: "PROJEKTED.appspot.com",
      messagingSenderId: "SZAMOK",
      appId: "APP_ID"
    };

    // Pontosan az az e-mail cím, amit magadnak hoztál létre:
    const ADMIN_EMAIL = "te_email_cimed@gmail.com";

    // Firebase Inicializáció
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentGifts = [];
    let modalImages = [];
    let modalImageIndex = 0;

    // ==========================================
    // 2. SÖTÉT / VILÁGOS TÉMA KAPCSOLÓ
    // ==========================================
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById("theme-toggle");

    // Mentett téma betöltése
    const savedTheme = localStorage.getItem("theme") || "dark";
    htmlEl.setAttribute("data-theme", savedTheme);

    themeBtn.addEventListener("click", () => {
      const currentTheme = htmlEl.getAttribute("data-theme");
      const nextTheme = currentTheme === "dark" ? "light" : "dark";
      htmlEl.setAttribute("data-theme", nextTheme);
      localStorage.setItem("theme", nextTheme);
    });

    // ==========================================
    // 3. HITELÉSÍTÉS ÉS JOGOSULTSÁG
    // ==========================================
    onAuthStateChanged(auth, (user) => {
      const loginView = document.getElementById("login-view");
      const appView = document.getElementById("app-view");
      const adminPanel = document.getElementById("admin-panel");
      const adminBadge = document.getElementById("admin-badge");

      if (user) {
        loginView.classList.add("hidden");
        appView.classList.remove("hidden");

        const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        if (isAdmin) {
          adminPanel.classList.remove("hidden");
          adminBadge.classList.remove("hidden");
        } else {
          adminPanel.classList.add("hidden");
          adminBadge.classList.add("hidden");
        }

        listenToGifts(isAdmin);
      } else {
        loginView.classList.remove("hidden");
        appView.classList.add("hidden");
      }
    });

    document.getElementById("btn-login").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-password").value;
      const errEl = document.getElementById("login-error");
      errEl.style.display = "none";

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        errEl.textContent = "Hibás e-mail vagy jelszó!";
        errEl.style.display = "block";
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

    // ==========================================
    // 4. ADATOK BETÖLTÉSE (VALÓS IDŐBEN)
    // ==========================================
    function listenToGifts(isAdmin) {
      const q = query(collection(db, "gifts"), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        currentGifts = [];
        const grid = document.getElementById("gift-grid");
        grid.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const item = { id: docSnap.id, ...docSnap.data() };
          currentGifts.push(item);

          const card = document.createElement("div");
          card.className = "gift-card";
          card.innerHTML = `
            <div onclick="window.openGiftModal('${item.id}')" style="width: 100%;">
              <div class="gift-icon">${item.icon || "🦈"}</div>
              <div class="gift-title">${item.title}</div>
            </div>
            ${isAdmin ? `<button class="btn-delete" onclick="window.deleteGift('${item.id}')">Törlés</button>` : ""}
          `;
          grid.appendChild(card);
        });
      });
    }

    // ==========================================
    // 5. ADMIN: ÚJ ELEM MENTÉSE ÉS KÉPFELTÖLTÉS
    // ==========================================
    document.getElementById("btn-create-gift").addEventListener("click", async () => {
      const title = document.getElementById("gift-title-input").value.trim();
      const icon = document.getElementById("gift-icon-input").value;
      const message = document.getElementById("gift-message-input").value.trim();
      const files = document.getElementById("gift-files-input").files;
      const status = document.getElementById("upload-status");

      if (!title || !message) {
        alert("Kérlek adj meg egy címet és egy üzenetet!");
        return;
      }

      status.textContent = "Mentés folyamatban...";
      const uploadedUrls = [];

      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          status.textContent = `Kép feltöltése (${i + 1}/${files.length})...`;
          const fileRef = ref(storage, `gifts/${Date.now()}_${file.name}`);
          await uploadBytes(fileRef, file);
          const url = await getDownloadURL(fileRef);
          uploadedUrls.push(url);
        }

        status.textContent = "Üzenet rögzítése...";
        await addDoc(collection(db, "gifts"), {
          title,
          icon,
          message,
          images: uploadedUrls,
          createdAt: serverTimestamp()
        });

        // Form ürítése
        document.getElementById("gift-title-input").value = "";
        document.getElementById("gift-message-input").value = "";
        document.getElementById("gift-files-input").value = "";
        status.textContent = "Sikeresen mentve! ✨";
        setTimeout(() => status.textContent = "", 3000);

      } catch (err) {
        console.error(err);
        status.textContent = "Hiba történt a mentés során!";
      }
    });

    window.deleteGift = async (id) => {
      if (confirm("Biztosan törölni szeretnéd ezt az üzenetet?")) {
        await deleteDoc(doc(db, "gifts", id));
      }
    };

    // ==========================================
    // 6. MODAL ÉS LAPOZÓ
    // ==========================================
    window.openGiftModal = (id) => {
      const item = currentGifts.find((g) => g.id === id);
      if (!item) return;

      document.getElementById("modal-title").textContent = item.title;
      document.getElementById("modal-message").textContent = item.message;

      modalImages = item.images || [];
      modalImageIndex = 0;

      const galleryEl = document.getElementById("modal-gallery");
      if (modalImages.length > 0) {
        galleryEl.classList.remove("hidden");
        updateGalleryUI();
      } else {
        galleryEl.classList.add("hidden");
      }

      document.getElementById("gift-modal").classList.remove("hidden");
    };

    function updateGalleryUI() {
      document.getElementById("gallery-img").src = modalImages[modalImageIndex];
      document.getElementById("gallery-counter").textContent = `${modalImageIndex + 1} / ${modalImages.length}`;
      
      const hasMultiple = modalImages.length > 1;
      document.getElementById("gallery-prev").style.display = hasMultiple ? "flex" : "none";
      document.getElementById("gallery-next").style.display = hasMultiple ? "flex" : "none";
    }

    document.getElementById("gallery-prev").addEventListener("click", () => {
      modalImageIndex = (modalImageIndex - 1 + modalImages.length) % modalImages.length;
      updateGalleryUI();
    });

    document.getElementById("gallery-next").addEventListener("click", () => {
      modalImageIndex = (modalImageIndex + 1) % modalImages.length;
      updateGalleryUI();
    });

    document.getElementById("modal-close").addEventListener("click", () => {
      document.getElementById("gift-modal").classList.add("hidden");
    });
  </script>
</body>
</html>
