<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Üzenetek</title>
  <style>
    :root[data-theme="light"] {
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --border: #cbd5e1;
      --input-bg: #f8fafc;
      --danger: #ef4444;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    :root[data-theme="dark"] {
      --bg: #060d17;
      --card-bg: #0d192d;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #38bdf8;
      --border: #1a2c47;
      --input-bg: #08101d;
      --danger: #ef4444;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      transition: background-color 0.25s, color 0.25s;
    }

    .hidden { display: none !important; }

    .app-header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-left h1 {
      font-size: 1.35rem;
      color: var(--text);
      font-weight: 700;
    }

    .badge {
      background: rgba(2, 132, 199, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      position: static;
    }

    .theme-toggle-box {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px;
      cursor: pointer;
      user-select: none;
    }

    .theme-opt {
      padding: 4px 8px;
      font-size: 0.8rem;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0.45;
      transition: opacity 0.2s, background 0.2s;
    }

    .theme-opt.active {
      opacity: 1;
      background: var(--card-bg);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--card-shadow);
      width: 100%;
      max-width: 520px;
      margin-bottom: 16px;
    }

    .login-card {
      max-width: 360px;
      margin-top: 40px;
      text-align: center;
    }

    .field {
      margin-bottom: 12px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input[type="file"] {
      width: 100%;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }
    .btn-primary:active { opacity: 0.85; }

    .gift-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 520px;
    }

    .gift-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 135px;
      box-shadow: var(--card-shadow);
    }
    .gift-card:active { transform: scale(0.98); }

    .gift-icon {
      font-size: 2.6rem;
      margin-bottom: 6px;
    }

    .gift-title {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-word;
    }

    .btn-delete {
      background: var(--danger);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      text-align: center;
    }

    .modal-text {
      white-space: pre-wrap;
      text-align: left;
      line-height: 1.5;
      font-size: 0.95rem;
      margin: 14px 0;
    }

    .gallery {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin: 12px 0;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gallery-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .gallery-btn.prev { left: 8px; }
    .gallery-btn.next { right: 8px; }

    .gallery-counter {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .btn-secondary {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 10px;
      width: 100%;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="login-view" class="card login-card">
    <h2 style="margin-bottom: 6px;">Belépés ✨</h2>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">Jelentkezz be az üzenetekhez</p>
    
    <div class="field">
      <input type="email" id="login-email" placeholder="E-mail cím" autocomplete="email" />
    </div>
    <div class="field">
      <input type="password" id="login-password" placeholder="Jelszó" />
    </div>

    <button class="btn-primary" id="btn-login">Bejelentkezés</button>
    <p id="login-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none;"></p>
  </div>

  <div id="app-view" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    
    <header class="app-header">
      <div class="header-left">
        <h1>Üzenetek</h1>
        <span id="admin-badge" class="badge hidden">Admin</span>
      </div>
      <div class="header-right">
        <div class="theme-toggle-box" id="theme-toggle">
          <div class="theme-opt" id="opt-light">☀️ 🦈</div>
          <div class="theme-opt active" id="opt-dark">🌚 🦈</div>
        </div>
        <button id="btn-logout" class="btn-logout">Kilépés</button>
      </div>
    </header>

    <div id="admin-panel" class="card hidden">
      <h2 style="font-size: 1.15rem; margin-bottom: 14px;">Új üzenet hozzáadása</h2>
      
      <div class="field">
        <input type="text" id="gift-title-input" placeholder="Cím" />
      </div>

      <div class="field">
        <label>Ikon:</label>
        <select id="gift-icon-input">
          <option value="🦈">🦈 Cápa</option>
          <option value="🎁">🎁 Ajándék</option>
          <option value="💌">💌 Levél</option>
          <option value="💖">💖 Szív</option>
          <option value="🧸">🧸 Maci</option>
          <option value="☕">☕ Kávé</option>
          <option value="🌟">🌟 Csillag</option>
        </select>
      </div>

      <div class="field">
        <textarea id="gift-message-input" placeholder="Üzenet szövege..."></textarea>
      </div>

      <div class="field">
        <label>Képek csatolása:</label>
        <input type="file" id="gift-files-input" accept="image/*" multiple />
      </div>

      <button class="btn-primary" id="btn-create-gift">Mentés</button>
      <p id="upload-status" style="font-size: 0.85rem; margin-top: 8px; color: var(--primary); text-align: center;"></p>
    </div>

    <div id="gift-grid" class="gift-grid"></div>
  </div>

  <div id="gift-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <h2 id="modal-title" style="color: var(--primary); font-size: 1.25rem;"></h2>
      <p id="modal-message" class="modal-text"></p>

      <div id="modal-gallery" class="gallery hidden">
        <img id="gallery-img" src="" alt="Kép" />
        <button class="gallery-btn prev" id="gallery-prev">❮</button>
        <button class="gallery-btn next" id="gallery-next">❯</button>
        <div class="gallery-counter" id="gallery-counter">1 / 1</div>
      </div>

      <button class="btn-secondary" id="modal-close">Bezárás</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "IDE_MASOLD_AZ_API_KEYT",
      authDomain: "PROJEKTED.firebaseapp.com",
      projectId: "PROJEKTED",
      storageBucket: "PROJEKTED.appspot.com",
      messagingSenderId: "SZAMOK",
      appId: "APP_ID"
    };

    const ADMIN_EMAIL = "te_email_cimed@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentGifts = [];
    let modalImages = [];
    let modalImageIndex = 0;

    const htmlEl = document.documentElement;
    const themeBox = document.getElementById("theme-toggle");
    const optLight = document.getElementById("opt-light");
    const optDark = document.getElementById("opt-dark");

    function applyTheme(theme) {
      htmlEl.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
      if (theme === "dark") {
        optDark.classList.add("active");
        optLight.classList.remove("active");
      } else {
        optLight.classList.add("active");
        optDark.classList.remove("active");
      }
    }

    const savedTheme = localStorage.getItem("theme") || "dark";
    applyTheme(savedTheme);

    themeBox.addEventListener("click", () => {
      const current = htmlEl.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    onAuthStateChanged(auth, (user) => {
      const loginView = document.getElementById("login-view");
      const appView = document.getElementById("app-view");
      const adminPanel = document.getElementById("admin-panel");
      const adminBadge = document.getElementById("admin-badge");

      if (user) {
        loginView.classList.add("hidden");
        appView.classList.remove("hidden");

        const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        if (isAdmin) {
          adminPanel.classList.remove("hidden");
          adminBadge.classList.remove("hidden");
        } else {
          adminPanel.classList.add("hidden");
          adminBadge.classList.add("hidden");
        }

        listenToGifts(isAdmin);
      } else {
        loginView.classList.remove("hidden");
        appView.classList.add("hidden");
      }
    });

    document.getElementById("btn-login").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-password").value;
      const errEl = document.getElementById("login-error");
      errEl.style.display = "none";

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        errEl.textContent = "Hibás adatok!";
        errEl.style.display = "block";
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

    function listenToGifts(isAdmin) {
      const q = query(collection(db, "gifts"), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        currentGifts = [];
        const grid = document.getElementById("gift-grid");
        grid.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const item = { id: docSnap.id, ...docSnap.data() };
          currentGifts.push(item);

          const card = document.createElement("div");
          card.className = "gift-card";
          card.innerHTML = `
            <div onclick="window.openGiftModal('${item.id}')" style="width: 100%;">
              <div class="gift-icon">${item.icon || "🦈"}</div>
              <div class="gift-title">${item.title}</div>
            </div>
            ${isAdmin ? `<button class="btn-delete" onclick="window.deleteGift('${item.id}')">Törlés</button>` : ""}
          `;
          grid.appendChild(card);
        });
      });
    }

    document.getElementById("btn-create-gift").addEventListener("click", async () => {
      const title = document.getElementById("gift-title-input").value.trim();
      const icon = document.getElementById("gift-icon-input").value;
      const message = document.getElementById("gift-message-input").value.trim();
      const files = document.getElementById("gift-files-input").files;
      const status = document.getElementById("upload-status");

      if (!title || !message) {
        alert("Cím és üzenet megadása kötelező!");
        return;
      }

      status.textContent = "Mentés folyamatban...";
      const uploadedUrls = [];

      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          status.textContent = `Kép feltöltése (${i + 1}/${files.length})...`;
          const fileRef = ref(storage, `gifts/${Date.now()}_${file.name}`);
          await uploadBytes(fileRef, file);
          const url = await getDownloadURL(fileRef);
          uploadedUrls.push(url);
        }

        status.textContent = "Rögzítés...";
        await addDoc(collection(db, "gifts"), {
          title,
          icon,
          message,
          images: uploadedUrls,
          createdAt: serverTimestamp()
        });

        document.getElementById("gift-title-input").value = "";
        document.getElementById("gift-message-input").value = "";
        document.getElementById("gift-files-input").value = "";
        status.textContent = "Sikeresen mentve!";
        setTimeout(() => status.textContent = "", 2500);

      } catch (err) {
        console.error(err);
        status.textContent = "Hiba történt!";
      }
    });

    window.deleteGift = async (id) => {
      if (confirm("Biztosan törlöd?")) {
        await deleteDoc(doc(db, "gifts", id));
      }
    };

    window.openGiftModal = (id) => {
      const item = currentGifts.find((g) => g.id === id);
      if (!item) return;

      document.getElementById("modal-title").textContent = item.title;
      document.getElementById("modal-message").textContent = item.message;

      modalImages = item.images || [];
      modalImageIndex = 0;

      const galleryEl = document.getElementById("modal-gallery");
      if (modalImages.length > 0) {
        galleryEl.classList.remove("hidden");
        updateGalleryUI();
      } else {
        galleryEl.classList.add("hidden");
      }

      document.getElementById("gift-modal").classList.remove("hidden");
    };

    function updateGalleryUI() {
      document.getElementById("gallery-img").src = modalImages[modalImageIndex];
      document.getElementById("gallery-counter").textContent = `${modalImageIndex + 1} / ${modalImages.length}`;
      
      const hasMultiple = modalImages.length > 1;
      document.getElementById("gallery-prev").style.display = hasMultiple ? "flex" : "none";
      document.getElementById("gallery-next").style.display = hasMultiple ? "flex" : "none";
    }

    document.getElementById("gallery-prev").addEventListener("click", () => {
      modalImageIndex = (modalImageIndex - 1 + modalImages.length) % modalImages.length;
      updateGalleryUI();
    });

    document.getElementById("gallery-next").addEventListener("click", () => {
      modalImageIndex = (modalImageIndex + 1) % modalImages.length;
      updateGalleryUI();
    });

    document.getElementById("modal-close").addEventListener("click", () => {
      document.getElementById("gift-modal").classList.add("hidden");
    });
  </script>
</body>
</html>
